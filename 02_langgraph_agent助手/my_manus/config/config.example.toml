[server]
host = "127.0.0.1"
port = 5173

[llm]
model = "qwen-plus"
api_key = ""
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
temperature = 0.2
max_tokens = 8192

[embedding]
model = "text-embedding-v3"
api_key = ""
base_url = ""

[search]
provider = "tavily"
api_key = ""
max_results = 10
rss_feeds = [
    "https://semiengineering.com/feed/",
]

[rag]
store_path = "src/manus/rag/store"
collection = "strategy"
cases_collection = "cases"
top_k = 5
score_threshold = 0.5
max_context_chars = 6000

[workflow]
max_retries = 1
max_deepen_retries = 1
gate_checklist_auto_retry = true
step_approval_required = true
lang = "zh"
irreplaceability_threshold = 3
max_run_minutes = 15
news_top_n = 5
hardware_focus_min = 4

[finance]
provider = "tushare"
api_key = ""   # 或设置环境变量 TUSHARE_TOKEN
timeout_sec = 10
cache_ttl_sec = 3600
max_retries = 2

[supplier_screen]
market = "CN"
board = "main"
exclude_star = true
exclude_chinext = true
exclude_bse = true
exclude_st = true
min_listing_days = 60

[output]
reports_dir = "output/reports"
filename_max_slug = 40
